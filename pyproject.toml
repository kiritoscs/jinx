[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-jinx"
version = "0.3.0"
description = "A full-stack i18n helper for Django projects"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "kiritoscs", email = "kiritoscs@gmail.com" },
]
keywords = [
  "django",
  "i18n",
  "internationalization",
  "translation",
  "localization",
  "l10n",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Framework :: Django",
  "Topic :: Software Development :: Internationalization",
]
dependencies = [
  "arrow>=1.2.2",
  "click>=8.1.3",
  "polib>=1.2.0",
  "requests>=2.28.2",
  "rich>=13.3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
]

[project.urls]
Homepage = "https://github.com/kiritoscs/jinx"
"Bug Tracker" = "https://github.com/kiritoscs/jinx/issues"

[project.scripts]
jinx = "jinx.cli:main"

[tool.setuptools.packages.find]
include = ["jinx*"]

[tool.setuptools.package-data]
jinx = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 119
skip-string-normalization = true

[tool.isort]
profile = "black"
known_first_party = ["jinx"]

[tool.mypy]
ignore_missing_imports = true
show_error_codes = true
strict_optional = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["polib", "requests", "arrow"]
ignore_missing_imports = true

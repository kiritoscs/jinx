################################################## Global ##################################################
[language]
# Project source language (see jinx.common.constants.LanguageEnum)
current = "zh-CN"
# Translation target language
dest = "en"

################################################## Marker ##################################################
[marker]
# Skip entire file when unsupported f-strings are found
strict_mode = false

[marker.filter]
exclude_paths = [
    "web",
    "scripts",
    "migrations",
    "tests",
]
exclude_files = [
    "manage.py",
    "urls.py",
    "wsgi.py",
    "tests.py",
]

[marker.translation_func]
default = "gettext_lazy"
alias = "_"

[marker.str_conditions.token]
contains = []
not_contains = []
startswith = []
not_startswith = []
endswith = []
not_endswith = ["\"\"\"", "'''"]

[marker.str_conditions.source_line]
contains = []
not_contains = ["logger", "__name__"]
startswith = []
not_startswith = []
endswith = []
not_endswith = ["\"\"\"", "'''"]

################################################## Translator ##################################################
[translator]
provider = "google_api"
mode = "update"

[youdao_client]
url = "https://openapi.youdao.com/api"
app_key = ""
app_secret = ""
# general | computers | medicine | finance
domain = "general"
